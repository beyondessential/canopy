[workspace]
resolver = "3"
members = [
	"crates/canopy-api-codegen",
	"crates/canopy-mcp",
	"crates/commons-errors",
	"crates/commons-servers",
	"crates/commons-tests",
	"crates/commons-types",
	"crates/database",
	"crates/jobs",
	"crates/private-server",
	"crates/public-server",
	"crates/relay",
	"crates/relay-protocol",
	"vendor/canopy-utoipa-axum",
]

# `bes-canopy-api` is a cargo project of its own, not a member here. release-plz's
# release command silently ignores any package whose manifest says
# `publish = false`, and every crate in this workspace is private, so a release-plz
# pointed at this workspace declines to release the one crate that is published.
# It depends on nothing here, so keeping it separate costs nothing and keeps that
# failure mode out of reach. See release-plz.toml.
exclude = ["crates/canopy-api"]

[workspace.dependencies]
anyhow = "1"
aws-config = "1.8.18"
aws-sdk-cloudwatch = "1.116.0"
aws-sdk-s3 = "1.136.0"
aws-sdk-sts = "1.107.0"
aws-smithy-mocks = "0.3.0"
axum = "0.8.9"
axum-test = "21.0.0"
# bestool-kopia's SigV4 re-signing proxy (S3P spec). The proxy feature uses the
# workspace's `aws-lc-rs` rustls provider.
bestool-kopia = { version = "0.5.0", features = ["proxy"] }
clap = "4.6.1"
diesel = "2.3.9"
diesel-async = "0.9.0"
futures = "0.3.32"
http = "1.4.0"
jiff = { version = "0.2.24", features = ["serde"] }
# k8s-openapi requires exactly one Kubernetes-version feature, and the version
# is pinned to match what kube depends on (a mismatch causes a duplicate
# k8s-openapi with no version feature → build failure). `v1_32` is a
# conservative recent control-plane version — CONFIRM against the actual EKS
# control-plane version with ops before release (see spec open-question).
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
# Disable kube's default `ring` crypto backend and use `aws-lc-rs` instead, so
# we don't pull in a second rustls provider alongside the one the AWS SDK and
# the rest of the workspace already use.
kube = { version = "4.0.0", default-features = false, features = [
	"client",
	"config",
	"rustls-tls",
	"aws-lc-rs",
] }
lloggs = "1.4.0"
miette = "7.6.0"
mobc = "0.9.0"
node-semver = "2.2.0"
problem_details = "0.10.0"
pulldown-cmark = { version = "0.13.4", features = ["html"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "stream"] }
rss = "2.0.13"
serde = "1.0.228"
tera = "2.0.0"
timesimp = "1.0.0"
tokio = "1.52.3"
tracing = "0.1.44"
utoipa = { version = "5", features = ["jiff_0_2", "uuid", "axum_extras"] }
# Vendored fork of utoipa-axum under vendor/canopy-utoipa-axum — panics on
# OpenAPI schema-name collisions instead of silently overwriting. See that
# crate's Cargo.toml header.
canopy-utoipa-axum = { path = "vendor/canopy-utoipa-axum" }
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Full debuginfo makes each integration-test binary ~720MB (86% DWARF), and
# linking dozens of them writes ~50GB per rebuild — enough sustained I/O to
# freeze the machine. Line tables keep file:line in backtraces at a fraction
# of the size; override with CARGO_PROFILE_DEV_DEBUG=full when a debugger
# session needs variable info.
[profile.dev]
debug = "line-tables-only"

# compile dependencies with some optimisations to reduce disk pressure
[profile.dev.package."*"]
opt-level = 1

# compile build scripts and macros quickly
[profile.dev.build-override]
opt-level = 0
codegen-units = 1024
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.release.build-override]
opt-level = 0
codegen-units = 1024
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
