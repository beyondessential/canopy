[package]
name = "pgro"
version = "0.4.32"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
bes-canopy-api = { path = "../canopy-api" }
bestool-kopia.workspace = true
cronexpr = "1.5.0"
futures.workspace = true
globset = "0.4.18"
handlebars = "6.4.1"
jiff.workspace = true
k8s-openapi = { workspace = true, features = ["schemars"] }
kube = { workspace = true, features = ["runtime", "derive", "ws"] }
kube_quantity = "0.9.0"
mimalloc = { version = "0.1.52", default-features = false }
percent-encoding = "2.3.2"
prometheus = "0.14.0"
rand = "0.10.1"
reqwest = { workspace = true, features = ["socks"] }
rust_decimal = "1.42.0"
schemars = { version = "1.2.1", features = ["jiff02"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
socket2 = "0.6.2"
strip-ansi-escapes = "0.2.1"
thiserror = "2.0.18"
tokio = { workspace = true, features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
bytes = "1.12.0"
http.workspace = true
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = "0.5.3"

[[bin]]
name = "canopy-proxy"
path = "src/bin/canopy_proxy.rs"
