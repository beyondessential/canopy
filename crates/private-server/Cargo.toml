[package]
publish = false
name = "private-server"
version = "1.0.0"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
oidc = { path = "../oidc" }
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sts.workspace = true
axum = { workspace = true, features = ["json", "macros"] }
axum-client-ip = { version = "1.3.1", features = ["forwarded-header"] }
axum-server-timing = "3.0.1"
base64 = "0.23.0"
bestool-postgres = "1.0.9"
canopy-mcp = { path = "../canopy-mcp" }
clap = { workspace = true, features = ["derive", "env"] }
commons-errors = { path = "../commons-errors" }
commons-servers = { path = "../commons-servers" }
commons-types = { path = "../commons-types" }
database = { path = "../database" }
futures.workspace = true
itertools = "0.15.0"
jiff = { version = "0.2.24", features = ["serde"] }
lloggs = { workspace = true, features = ["miette-7"] }
mime_guess = "2.0.5"
miette = { workspace = true, features = ["fancy"] }
public-server = { path = "../public-server", default-features = false }
rust-embed = { version = "8.11.0", features = ["mime-guess", "interpolate-folder-path"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = "1.0.150"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-postgres = { version = "0.7.17", features = ["with-jiff-0_2", "with-serde_json-1", "with-uuid-1"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tracing.workspace = true
utoipa.workspace = true
canopy-utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true
uuid = { version = "1.23.1", features = ["serde", "v4"] }
chbs = "0.1.1"
algae-cli = "1.1.0"

[dev-dependencies]
age = { version = "0.12.1", default-features = false }
commons-tests = { path = "../commons-tests" }
hex = "0.4.3"
rcgen = "0.14.8"
