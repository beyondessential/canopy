[package]
publish = false
name = "commons-types"
description = "Serialisable types shared across the canopy crates."
version = "1.0.0"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
base64 = "0.23.0"
commons-errors = { path = "../commons-errors" }
cronexpr = "1.7.0"
diesel = { workspace = true, features = ["postgres_backend", "serde_json"] }
jiff.workspace = true
node-semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
utoipa.workspace = true
uuid = { version = "1.23.1", features = ["serde"] }
