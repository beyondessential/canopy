[package]
publish = false
name = "database"
version = "1.0.0"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
base64 = "0.23.0"
clap = { workspace = true, features = ["derive", "env"] }
commons-errors = { path = "../commons-errors" }
commons-types = { path = "../commons-types" }
diesel = { workspace = true, features = [
	"ipnet-address",
	"serde_json",
	"uuid",
	"postgres_backend",
] }
diesel-async = { workspace = true, features = ["mobc", "postgres", "migrations", "async-connection-wrapper"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
diesel_migrations = "2.3.2"
futures = "0.3.32"
hex = "0.4.3"
ipnet = { version = "2.12.0", features = ["serde"] }
jiff.workspace = true
jiff-diesel = { version = "0.1.3", features = ["postgres"] }
lloggs = { workspace = true, features = ["miette-7"] }
miette.workspace = true
mobc = { workspace = true }
node-semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tracing.workspace = true
url = { version = "2.5.8", features = ["serde"] }
utoipa.workspace = true
uuid = { version = "1.23.1", features = ["serde", "v4"] }

bestool-postgres = "1.0.9"
getrandom = "0.4.2"

[dev-dependencies]
commons-tests = { path = "../commons-tests" }
rcgen = "0.14.8"
tokio = { workspace = true, features = ["io-util"] }
