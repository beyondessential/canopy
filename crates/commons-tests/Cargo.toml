[package]
publish = false
name = "commons-tests"
version = "1.0.0"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
oidc = { path = "../oidc" }
axum = { workspace = true, features = ["json", "macros"] }
axum-client-ip = { version = "1.3.1", features = ["forwarded-header"] }
axum-server-timing = "3.0.1"
axum-test.workspace = true
commons-servers = { path = "../commons-servers" }
commons-types = { path = "../commons-types" }
database = { path = "../database" }
diesel.workspace = true
diesel-async.workspace = true
diesel_migrations = "2.3.2"
miette.workspace = true
percent-encoding = "2.3.2"
private-server = { path = "../private-server" }
public-server = { path = "../public-server" }
rcgen = "0.14.8"
ring = "0.17.14"
time = "0.3.47"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
x509-parser = "0.18.1"
