[package]
# Generates crates/canopy-api/src/generated.rs from the public server's OpenAPI
# document. Run via `just gen-api`; the output is committed.
publish = false
name = "canopy-api-codegen"
version = "0.0.0"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"

[[bin]]
name = "canopy-api-codegen"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
prettyplease = "0.3.0"
schemars = "1.2.2"
serde_json = "1.0.150"
syn = { version = "3.0.3", features = ["full", "parsing", "printing"] }
typify = "0.7.0"
