[package]
publish = false
name = "public-server"
version = "1.0.0"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[[bin]]
name = "public-server"
required-features = ["cli"]

[dependencies]
aws-config.workspace = true
aws-sdk-sts.workspace = true
axum = { workspace = true, features = ["json", "macros"] }
canopy-mcp = { path = "../canopy-mcp" }
clap = { workspace = true, optional = true, features = ["derive", "env"] }
commons-errors = { path = "../commons-errors" }
commons-servers = { path = "../commons-servers" }
commons-types = { path = "../commons-types" }
diesel = { workspace = true, features = [
	"ipnet-address",
	"serde_json",
	"uuid",
	"postgres_backend",
] }
diesel-async.workspace = true
database = { path = "../database" }
futures.workspace = true
jiff.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
lloggs = { workspace = true, optional = true, features = ["miette-7"] }
miette = { workspace = true, optional = true, features = ["fancy"] }
node-semver.workspace = true
pulldown-cmark = { workspace = true, optional = true }
qrcode = { version = "0.14.1", optional = true, features = ["svg"] }
reqwest.workspace = true
rss = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
tera = { workspace = true, optional = true }
tokio.workspace = true
timesimp = { version = "1.0.0", optional = true }
tower-http = { version = "0.7.0", optional = true, features = [
	"compression-full",
	"fs",
	"trace",
] }
utoipa.workspace = true
canopy-utoipa-axum.workspace = true
utoipa-swagger-ui = { workspace = true, optional = true }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
serde_json = "1.0.150"
axum-client-ip = { version = "1.3.1", features = ["forwarded-header"] }
subtle = "2.6.1"
base64 = "0.23.0"
tracing.workspace = true

[dev-dependencies]
aws-sdk-sts = { workspace = true, features = ["test-util"] }
aws-smithy-mocks.workspace = true
axum-test.workspace = true
commons-tests = { path = "../commons-tests" }
hex = "0.4.3"
http.workspace = true
percent-encoding = "2.3.2"
rcgen = "0.14.8"
ring = "0.17.14"
serde_json = "1.0.150"

[features]
default = ["cli", "ui"]
cli = [
	"ui",
	"dep:clap",
	"dep:lloggs",
	"dep:miette",
	"dep:utoipa-swagger-ui",
]
ui = [
	"dep:pulldown-cmark",
	"dep:qrcode",
	"dep:rss",
	"dep:tera",
	"dep:timesimp",
	"dep:tower-http",
]
