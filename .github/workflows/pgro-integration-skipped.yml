name: pgro integration (skipped)

# The inverse of the path filters on pgro-integration.yml. A required check that
# a workflow never reports stays pending, so a change that touches none of those
# paths reports the same check here, already green.
on:
  pull_request:
    paths-ignore:
      - crates/pgro/**
      - crates/canopy-api/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/pgro-integration.yml
  push:
    branches:
      - main
    paths-ignore:
      - crates/pgro/**
      - crates/canopy-api/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/pgro-integration.yml

jobs:
  all-green:
    name: All integrations green
    runs-on: ubuntu-slim
    steps:
      - run: echo "No change here can affect the pgro integration tests"
